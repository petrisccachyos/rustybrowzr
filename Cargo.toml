[package]
name = "rustybrowzr"
version = "0.1.0"
edition = "2024"
description = "A small Rust browser with a dark desktop interface"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
webkit6 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

